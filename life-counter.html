<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d1710">
  <title>MTG Life Counter | Dice Tower Board Game Cafe</title>
  <meta name="description" content="A full-screen Magic: The Gathering life counter for your next game night.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Metamorphous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/life-counter.css?v=13">
</head>
<body class="counter-page">
  <main class="counter-app" id="counterApp">
    <header class="counter-toolbar">
      <a class="counter-back" href="activities.html" aria-label="Back to interactive activities">‹ <span>Activities</span></a>
      <div class="counter-brand"><span>Dice Tower Life Counter</span></div>
      <div class="toolbar-actions">
        <button class="tool-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
        <button class="tool-button" id="settingsButton" type="button" aria-label="Game settings" title="Game settings">⚙</button>
      </div>
    </header>
    <section class="counter-table" aria-label="Magic life counter">
      <div class="table-glow" aria-hidden="true"></div>
      <div class="player-grid" id="playerGrid" role="group" aria-label="Player life counters"></div>
      <p class="table-hint" id="tableHint">Tap + or − to change life · Hold to change by 10</p>
    </section>
    <footer class="counter-footer"><span id="gameSummary">4 players · 40 starting life</span><button id="newGameButton" type="button">New game</button></footer>
  </main>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <form id="settingsForm" method="dialog">
      <div class="dialog-heading"><div><p class="settings-kicker">Game setup</p><h1 id="settingsTitle">Set the table</h1></div><button class="dialog-close" type="button" id="closeSettings" aria-label="Close settings">×</button></div>
      <label for="playerCount">Players</label>
      <select id="playerCount" name="playerCount"><option value="2">2 players</option><option value="3">3 players</option><option value="4" selected>4 players</option><option value="5">5 players</option><option value="6">6 players</option></select>
      <label for="startingLife">Starting life</label>
      <select id="startingLife" name="startingLife"><option value="20">20 life</option><option value="30">30 life</option><option value="40" selected>40 life</option><option value="50">50 life</option><option value="60">60 life</option></select>
      <button class="start-game" type="submit">Start game</button>
      <p class="settings-note">Your current game is saved on this device.</p>
    </form>
  </dialog>
  <dialog class="counter-dialog" id="counterDialog" aria-labelledby="counterDialogTitle">
    <div class="dialog-heading"><div><p class="settings-kicker" id="counterDialogKicker">Player counters</p><h2 id="counterDialogTitle">Counters</h2></div><button class="dialog-close" type="button" id="closeCounters" aria-label="Close counters">×</button></div>
    <div id="counterDetails"></div>
  </dialog>
  <script src="js/life-counter.js?v=11"></script>
</body>
</html>
